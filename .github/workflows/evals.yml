name: Agent evaluation gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-evals:
    name: 218 agent regression scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and test dependencies
        run: pip install -e ".[dev]"
      - name: Static analysis
        run: ruff check app tests
      - name: Unit and integration tests
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Run all golden agent evaluations
        env:
          DATABASE_URL: sqlite:///./ci-evals.db
        run: python -m app.evals.cli --provider mock --all --baseline 0.90 --threshold 0.01

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

