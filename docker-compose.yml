services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baseline
      POSTGRES_USER: baseline
      POSTGRES_PASSWORD: baseline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - baseline-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DEMO_MODE: ${DEMO_MODE:-false}
      BASELINE_FIXTURE_CONNECTORS: ${BASELINE_FIXTURE_CONNECTORS:-false}
      DATABASE_URL: postgresql+psycopg://baseline:baseline@postgres:5432/baseline
      FRONTEND_ORIGIN: http://localhost:3000
      AGENT_EXECUTION_ENABLED: ${AGENT_EXECUTION_ENABLED:-true}
      SAFETY_ADMIN_KEY: ${SAFETY_ADMIN_KEY:-}
      JOB_BACKEND: ${JOB_BACKEND:-inline}
      REDIS_URL: redis://redis:6379/0
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      CONNECTOR_TIMEOUT_SECONDS: ${CONNECTOR_TIMEOUT_SECONDS:-8}
      CONNECTOR_MAX_RESPONSE_BYTES: ${CONNECTOR_MAX_RESPONSE_BYTES:-2000000}
      CONNECTOR_MAX_RETRIES: ${CONNECTOR_MAX_RETRIES:-2}
      CONNECTOR_ALLOWED_DOMAINS: ${CONNECTOR_ALLOWED_DOMAINS:-sec.gov,www.sec.gov,data.sec.gov,api.github.com,github.com,api.tavily.com}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m app.migration_bootstrap && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  baseline-data:
