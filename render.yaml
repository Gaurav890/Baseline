databases:
  - name: baseline-db
    databaseName: baseline
    user: baseline
    plan: basic-256mb
    ipAllowList: []

services:
  - type: keyvalue
    name: baseline-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: baseline-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "false"
      - key: BASELINE_FIXTURE_CONNECTORS
        value: "false"
      - key: JOB_BACKEND
        value: redis
      - key: DATABASE_URL
        fromDatabase:
          name: baseline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: baseline-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_REQUESTS_PER_SECOND
        value: "4"
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CHECKS_ENABLED
        value: "false"
      - key: GITHUB_REPOSITORY_ALLOWLIST
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: baseline-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.jobs.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "false"
      - key: BASELINE_FIXTURE_CONNECTORS
        value: "false"
      - key: JOB_BACKEND
        value: redis
      - key: DATABASE_URL
        fromDatabase:
          name: baseline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: baseline-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_REQUESTS_PER_SECOND
        value: "4"
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CHECKS_ENABLED
        value: "false"
      - key: GITHUB_REPOSITORY_ALLOWLIST
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
